<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Magyarországi Informatikai és Programozó Versenyek 2026/2027</title>
<script>
  // Mentett téma visszaállítása minél korábban, hogy ne villanjon fel a rossz téma.
  (function () {
    try {
      var saved = localStorage.getItem("versenyek-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) { /* localStorage nem elérhető (pl. privát böngészés) */ }
  })();
</script>
<link rel="stylesheet" href="https://unpkg.com/createdomblocks@2.0.1/dist/style.css" />
<style>
  :root {
    --page-max-width: 1100px;
  }
  /* Sötét mód: rendszerbeállítás szerint, hacsak a felhasználó explicit nem állított be világosat */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --secondary: #9ca3af;
      --success: #4ade80;
      --success-bg: #14532d;
      --error: #f87171;
      --error-bg: #450a0a;
      --warning: #fbbf24;
      --warning-bg: #451a03;
      --info: #60a5fa;
      --info-bg: #1e3a5f;
      --neutral: #9ca3af;
      --neutral-bg: #27272a;
      --text: #f3f4f6;
      --text-light: #9ca3af;
      --border: #374151;
      --bg: #1f2937;
      --bg-alt: #111827;
    }
  }
  /* Sötét mód: explicit felhasználói választás (a rendszerbeállítástól függetlenül) */
  :root[data-theme="dark"] {
    --primary: #60a5fa;
    --primary-hover: #3b82f6;
    --secondary: #9ca3af;
    --success: #4ade80;
    --success-bg: #14532d;
    --error: #f87171;
    --error-bg: #450a0a;
    --warning: #fbbf24;
    --warning-bg: #451a03;
    --info: #60a5fa;
    --info-bg: #1e3a5f;
    --neutral: #9ca3af;
    --neutral-bg: #27272a;
    --text: #f3f4f6;
    --text-light: #9ca3af;
    --border: #374151;
    --bg: #1f2937;
    --bg-alt: #111827;
  }
  /*
    A createdomblocks könyvtár az alert/toast/badge success/error/warning/info
    variánsainál NEM CSS-változóval, hanem fixen beégetett (csak világos
    háttérhez tervezett, pl. #166534 sötétzöld) szövegszínt használ. Sötét
    módban ez a sötét háttérszínen (--success-bg stb.) szinte olvashatatlan
    (zöld-a-zöldön / kék-a-kéken) — ezért itt felülírjuk világosabb, megfelelő
    kontrasztú szövegszínekre, ugyanazzal a kettős (media query + explicit
    data-theme) mintával, mint a többi sötét mód szabály.
  */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .alert-success,
    :root:not([data-theme="light"]) .toast-success,
    :root:not([data-theme="light"]) .badge-success { color: #bbf7d0; }
    :root:not([data-theme="light"]) .alert-error,
    :root:not([data-theme="light"]) .toast-error,
    :root:not([data-theme="light"]) .badge-error { color: #fecaca; }
    :root:not([data-theme="light"]) .alert-warning,
    :root:not([data-theme="light"]) .toast-warning,
    :root:not([data-theme="light"]) .badge-warning { color: #fde68a; }
    :root:not([data-theme="light"]) .alert-info,
    :root:not([data-theme="light"]) .toast-info,
    :root:not([data-theme="light"]) .badge-info,
    :root:not([data-theme="light"]) .badge { color: #bfdbfe; }
  }
  :root[data-theme="dark"] .alert-success,
  :root[data-theme="dark"] .toast-success,
  :root[data-theme="dark"] .badge-success { color: #bbf7d0; }
  :root[data-theme="dark"] .alert-error,
  :root[data-theme="dark"] .toast-error,
  :root[data-theme="dark"] .badge-error { color: #fecaca; }
  :root[data-theme="dark"] .alert-warning,
  :root[data-theme="dark"] .toast-warning,
  :root[data-theme="dark"] .badge-warning { color: #fde68a; }
  :root[data-theme="dark"] .alert-info,
  :root[data-theme="dark"] .toast-info,
  :root[data-theme="dark"] .badge-info,
  :root[data-theme="dark"] .badge { color: #bfdbfe; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-alt);
    color: var(--text);
  }
  /*
    A createDOMBlocks createContainer()-je a "container" ÉS a "page" osztályt is
    ráteszi ugyanarra az elemre. A könyvtár .container szabálya adna 1rem oldalsó
    paddingot, de mivel ez a .page szabály azonos specificitású és később töltődik
    be, teljesen felülírta azt — emiatt mobil nézetben a tartalom a képernyő
    szélét érintette. Explicit oldalsó paddingot adunk, mobilon kicsivel kisebbet.
  */
  .page { padding: 2rem 1rem 4rem; }
  @media (max-width: 480px) {
    .page { padding: 1.5rem 0.75rem 3rem; }
  }
  .header-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .header-text { flex: 1 1 auto; min-width: 0; }
  #theme-toggle { flex: 0 0 auto; white-space: nowrap; }
  .subtitle { color: var(--text-light); margin-top: -0.5rem; }
  .meta-line { color: var(--text-light); font-size: 0.9rem; }
  .stats-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
  .legend-row { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0.75rem 0 1.25rem; font-size: 0.9rem; color: var(--text-light); }
  .legend-row span.legend-item { display: inline-flex; align-items: center; gap: 0.35rem; }
  .filter-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.5rem 0 1.5rem; }
  /*
    A createdomblocks könyvtár a .btn-hez alapból nem ad háttér- vagy
    szövegszínt (csak :hover-re), így a böngésző natív gombstílusára hagyatkozik
    — ez sötét módban rossz kontrasztot adhat. Explicit, téma-tudatos alapstílust
    adunk minden gombnak.
  */
  .btn { background-color: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .filter-bar .btn.active {
    background-color: var(--primary-hover);
    color: #ffffff;
    border-color: var(--primary-hover);
    box-shadow: var(--shadow-md);
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  #competition-grid { align-items: start; }
  @media (max-width: 680px) {
    #competition-grid { grid-template-columns: 1fr !important; }
  }
  .comp-card { border-left: 5px solid var(--border); transition: box-shadow 0.2s ease; }
  .comp-card[data-status="yes"] { border-left-color: var(--success); }
  .comp-card[data-status="no"] { border-left-color: var(--error); }
  .comp-card[data-status="unsure"] { border-left-color: var(--warning); }
  .comp-card.is-hidden { display: none; }
  /* Lejárt határidejű versenyek: halványított, szürkített megjelenés, de nem elrejtve (azt a kapcsoló dönti el). */
  .comp-card.is-expired { filter: grayscale(0.85) opacity(0.65); }
  .comp-card.is-expired:hover { filter: grayscale(0.5) opacity(0.85); }
  .expired-toggle-row { margin: -0.5rem 0 1.25rem; font-size: 0.9rem; }
  /* A könyvtár .checkbox-input-je alapból oszlopba (label fölé, input alá) rendez —
     egy jelölőnégyzetnél ehelyett egy sorban, egymás mellett akarjuk a kettőt. */
  .expired-toggle-row .checkbox-input { flex-direction: row; align-items: center; gap: 0.5rem; margin-bottom: 0; }
  .expired-toggle-row label { color: var(--text-light); cursor: pointer; font-weight: 400 !important; }
  .expired-toggle-row input[type="checkbox"] { cursor: pointer; width: 1.1rem; height: 1.1rem; }
  .comp-meta .badge { margin-bottom: 0.75rem; margin-right: 0.4rem; }
  .comp-countdown { font-size: 0.85rem; font-weight: 600; margin: 0.4rem 0 0; color: var(--text-light); }
  .comp-fields { margin: 0 0 0.75rem; }
  .comp-row { display: flex; gap: 0.75rem; padding: 0.3rem 0; border-bottom: 1px dashed var(--border); font-size: 0.92rem; }
  .comp-row:last-child { border-bottom: none; }
  .comp-row dt { flex: 0 0 40%; margin: 0; color: var(--text-light); font-weight: 600; }
  .comp-row dd { margin: 0; flex: 1; }
  .comp-note { font-size: 0.85rem; color: var(--text-light); font-style: italic; margin: 0.5rem 0 0; }
  .comp-link { display: inline-block; margin-top: 0.6rem; font-weight: 600; }
  footer.page-footer { margin-top: 2rem; font-size: 0.85rem; color: var(--text-light); }
  footer.page-footer a { color: inherit; }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/domelemjs@2.0.1/dist/index.browser.js"></script>
  <script src="https://unpkg.com/createdomblocks@2.0.1/dist/index.js"></script>
  <!--
    EGYETLEN ADATFORRÁS — a teljes oldal a COMPETITION_DATA objektumból épül fel,
    amit a scripts/scrape_competitions.py generál. Ne szerkeszd kézzel a
    competitions-data.js-t — futtasd újra a scrapert helyette.
  -->
  <script src="competitions-data.js"></script>
  <script>
  (function () {
    "use strict";
    // ======================================================================
    // RENDERELÉS — DOMelemJS (DOMElemJS.createDOMElem) + createDOMBlocks
    // (CreateDOMBlocks.*) segítségével, kizárólag a fenti adatobjektumból.
    // ======================================================================
    var createDOMElem = DOMElemJS.createDOMElem;
    var CDB = CreateDOMBlocks;
    var THEME_KEY = "versenyek-theme";

    // --- világos / sötét mód kezelése ---
    function getStoredTheme() {
      try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; }
    }
    function setStoredTheme(theme) {
      try {
        if (theme) { localStorage.setItem(THEME_KEY, theme); }
        else { localStorage.removeItem(THEME_KEY); }
      } catch (e) { /* localStorage nem elérhető */ }
    }
    function getEffectiveTheme() {
      var stored = getStoredTheme();
      if (stored === "light" || stored === "dark") { return stored; }
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
    }
    function themeButtonLabel(theme) {
      return theme === "dark" ? "☀️ Világos mód" : "🌙 Sötét mód";
    }

    // --- határidő-számítás és rendezés a mai dátumhoz képest ---
    function daysUntilDeadline(deadlineDate) {
      if (!deadlineDate) { return null; }
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      var parts = deadlineDate.split("-").map(Number);
      var deadline = new Date(parts[0], parts[1] - 1, parts[2]);
      return Math.round((deadline - today) / 86400000);
    }

    function countdownText(days) {
      if (days === null) { return null; }
      if (days === 0) { return "⏰ Ma jár le a nevezési határidő!"; }
      if (days > 0) { return "⏳ " + days + " nap múlva jár le a nevezési határidő"; }
      return "✖️ " + Math.abs(days) + " napja lejárt a nevezési határidő";
    }

    // A versenyeket a nevezési határidő szerint rendezi: a legközelebb lejáró
    // (de még nem lejárt) határidejűek elöl, utánuk az ismeretlen/folyamatos
    // határidejűek, végül a már lejártak — azok közül is a régebben lejártak
    // kerülnek leghátrébb.
    function sortItemsByDeadline(items) {
      var withDays = items.map(function (item) {
        return { item: item, days: daysUntilDeadline(item.deadlineDate) };
      });
      var upcoming = withDays.filter(function (x) { return x.days !== null && x.days >= 0; });
      var unknown = withDays.filter(function (x) { return x.days === null; });
      var expired = withDays.filter(function (x) { return x.days !== null && x.days < 0; });

      upcoming.sort(function (a, b) { return a.days - b.days; });
      expired.sort(function (a, b) { return b.days - a.days; });

      return upcoming.concat(unknown, expired).map(function (x) { return x.item; });
    }

    function renderPage(data) {
      var page = CDB.createContainer({ parent: "#app", id: "page", class: "page" });

      var headerBar = createDOMElem({ tag: "div", attrs: { class: "header-bar" }, parent: page });
      var headerText = createDOMElem({ tag: "div", attrs: { class: "header-text" }, parent: headerBar });

      CDB.createTitle({ parent: headerText, id: "page-title", text: "Magyarországi Informatikai és Programozó Versenyek" }, 1);
      CDB.createTitle({ parent: headerText, id: "page-subtitle", text: data.schoolYear + "-es tanév", class: "subtitle" }, 2);
      createDOMElem({
        tag: "p", parent: headerText, attrs: { class: "meta-line" },
        text: "Adatvezérelt áttekintő — egyetlen JavaScript objektumból renderelve, DOMelemJS + createDOMBlocks segítségével."
      });

      var themeBtn = CDB.createButton({
        parent: headerBar, id: "theme-toggle",
        text: themeButtonLabel(getEffectiveTheme()),
        click: function () {
          var next = getEffectiveTheme() === "dark" ? "light" : "dark";
          applyTheme(next);
          setStoredTheme(next);
          themeBtn.textContent = themeButtonLabel(next);
        }
      });
      // Amíg a felhasználó nem választott explicit témát, kövessük élőben a
      // rendszer világos/sötét beállításának változását is (csak a gomb feliratán).
      if (window.matchMedia) {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
          if (!getStoredTheme()) { themeBtn.textContent = themeButtonLabel(getEffectiveTheme()); }
        });
      }

      CDB.createAlert({
        parent: page, id: "status-alert", type: "info",
        title: "Utolsó ellenőrzés: " + data.statusCheckedAt,
        message: "A státuszok a versenyek hivatalos honlapjainak automatizált, webes ellenőrzésén alapulnak. Ahol még nincs 2026/27-es kiírás, ott a legutóbb ismert adatok láthatók."
      });

      // --- jelmagyarázat, a statusLegend objektumból felépítve ---
      var legendRow = createDOMElem({ tag: "div", attrs: { class: "legend-row" }, parent: page });
      Object.keys(data.statusLegend).forEach(function (key) {
        var l = data.statusLegend[key];
        createDOMElem({
          tag: "span", parent: legendRow, attrs: { class: "legend-item" },
          children: [
            { tag: "span", text: l.icon },
            { tag: "span", text: l.label }
          ]
        });
      });

      CDB.createDivider({ parent: page, id: "divider-1" });

      // --- statisztika a data.items alapján kiszámolva ---
      var counts = { yes: 0, no: 0, unsure: 0 };
      data.items.forEach(function (item) { counts[item.status]++; });

      var statsRow = createDOMElem({ tag: "div", attrs: { class: "stats-row" }, parent: page });
      CDB.createBadge({ parent: statsRow, id: "stat-total", text: "Összesen: " + data.items.length + " verseny", type: "neutral" });
      Object.keys(data.statusLegend).forEach(function (key) {
        var l = data.statusLegend[key];
        CDB.createBadge({
          parent: statsRow, id: "stat-" + key,
          text: l.icon + " " + l.shortLabel + ": " + counts[key],
          type: l.badgeType
        });
      });

      // --- szűrő gombsor ---
      var filterBar = createDOMElem({ tag: "div", attrs: { class: "filter-bar" }, parent: page });
      var currentFilterKey = "all";
      var showExpired = true;

      function updateVisibility() {
        var cards = document.querySelectorAll("#competition-grid .comp-card");
        cards.forEach(function (card) {
          var matchesFilter = currentFilterKey === "all"
            || (currentFilterKey === "registered"
                  ? card.dataset.registered === "true"
                  : card.dataset.status === currentFilterKey);
          var matchesExpiredToggle = showExpired || card.dataset.expired !== "true";
          card.classList.toggle("is-hidden", !(matchesFilter && matchesExpiredToggle));
        });
      }

      function applyFilter(key) {
        currentFilterKey = key;
        filterBar.querySelectorAll(".btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.id === "filter-" + key);
        });
        updateVisibility();
      }

      var allBtn = CDB.createButton({
        parent: filterBar, id: "filter-all", text: "Összes (" + data.items.length + ")",
        click: function () { applyFilter("all"); }
      });
      Object.keys(data.statusLegend).forEach(function (key) {
        var l = data.statusLegend[key];
        CDB.createButton({
          parent: filterBar, id: "filter-" + key,
          text: l.icon + " " + l.shortLabel + " (" + counts[key] + ")",
          click: function () { applyFilter(key); }
        });
      });
      var registeredCount = data.items.filter(function (i) { return i.registered; }).length;
      CDB.createButton({
        parent: filterBar, id: "filter-registered",
        text: "📝 Neveztünk (" + registeredCount + ")",
        click: function () { applyFilter("registered"); }
      });
      allBtn.classList.add("active");

      // --- "lejárt határidejűek mutatása" kapcsoló ---
      var expiredToggleRow = createDOMElem({ tag: "div", attrs: { class: "expired-toggle-row" }, parent: page });
      CDB.createCheckbox({
        parent: expiredToggleRow, id: "show-expired-toggle",
        labelText: "Lejárt határidejű versenyek mutatása (szürkítve)",
        labelfirst: false,
        checked: true,
        onChange: function (e) {
          showExpired = e.target.checked;
          updateVisibility();
        }
      });

      // --- verseny-kártyák rácsa ---
      var grid = CDB.createGrid({ parent: page, id: "competition-grid", class: "competition-grid", columns: 2, gap: "1.25rem" });

      sortItemsByDeadline(data.items).forEach(function (item) {
        renderCard(grid, item, data.statusLegend[item.status]);
      });

      CDB.createDivider({ parent: page, id: "divider-2" });

      createDOMElem({
        tag: "footer", parent: page, attrs: { class: "page-footer" },
        children: [
          {
            tag: "p",
            children: [
              { tag: "span", text: "Forrás és teljes ellenőrzési jegyzőkönyv: " },
              { tag: "a", text: "figyelendo_versenyek_2026_2027.md", attrs: { href: "./figyelendo_versenyek_2026_2027.md" } },
              { tag: "span", text: " · " },
              { tag: "a", text: "versenyek_2026_2027_statusz.md", attrs: { href: "./versenyek_2026_2027_statusz.md" } }
            ]
          },
          { tag: "p", text: "Renderelve: DOMelemJS (createDOMElem) + createDOMBlocks (createdomblocks) — a competitions-data.js-ből importált egyetlen JS adatobjektumból. Az adatokat a scripts/scrape_competitions.py scraper generálja." }
        ]
      });
    }

    function renderCard(grid, item, legend) {
      // A kártya belső tartalmát közvetlenül DOMElemJS.createDOMElem-mel építjük fel
      // (append: false — csak a createCard() kapja meg a végén, body-ként).
      var metaWrap = createDOMElem({ tag: "div", attrs: { class: "comp-meta" }, append: false });

      CDB.createBadge({
        parent: metaWrap, id: "badge-" + item.id,
        text: legend.icon + " " + legend.shortLabel,
        type: legend.badgeType
      });
      if (item.registered) {
        CDB.createBadge({
          parent: metaWrap, id: "badge-registered-" + item.id,
          text: "📝 Neveztünk", type: "info"
        });
      }

      var fields = [
        { label: "Fókusz", value: item.focus },
        { label: "Korosztály", value: item.age },
        { label: "Típus", value: item.type },
        { label: "Kiírás megjelenése", value: item.announce },
        { label: "Nevezési határidő", value: item.deadline },
        { label: "Verseny időpontja", value: item.eventDate }
      ];

      createDOMElem({
        tag: "dl", parent: metaWrap, attrs: { class: "comp-fields" },
        children: fields.map(function (f) {
          return {
            tag: "div", attrs: { class: "comp-row" },
            children: [
              { tag: "dt", text: f.label },
              { tag: "dd", text: f.value }
            ]
          };
        })
      });

      var days = daysUntilDeadline(item.deadlineDate);
      var countdown = countdownText(days);
      if (countdown) {
        CDB.createParagraph({ parent: metaWrap, id: "countdown-" + item.id, text: countdown, class: "comp-countdown" });
      }

      CDB.createParagraph({ parent: metaWrap, id: "note-" + item.id, text: item.note, class: "comp-note" });
      CDB.createLink({ parent: metaWrap, id: "link-" + item.id, text: "Hivatalos oldal →", href: item.link, target: "_blank" });

      var titleText = (item.fee ? item.fee + " " : "") + item.name;
      var card = CDB.createCard({
        parent: grid, id: "card-" + item.id, class: "comp-card",
        title: titleText,
        body: metaWrap
      });
      card.dataset.status = item.status;
      card.dataset.registered = item.registered ? "true" : "false";
      var isExpired = days !== null && days < 0;
      card.dataset.expired = isExpired ? "true" : "false";
      card.classList.toggle("is-expired", isExpired);
    }

    renderPage(COMPETITION_DATA);
  })();
  </script>
</body>
</html>
